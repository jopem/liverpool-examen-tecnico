spring.application.name=liverpool-examen-tecnico

# MongoDB local (docker compose up -d). Sin credenciales en el repositorio; para otro servidor,
# define la variable de entorno MONGODB_URI.
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/liverpool}
# Crea el índice único del correo al arrancar.
spring.data.mongodb.auto-index-creation=true

# Servicio externo de pedidos e items (solo lectura).
orders.source.base-url=https://6994a4eab081bc23e9c0f61e.mockapi.io/api/v1
orders.source.timeout=5s
# Vigencia de la copia en memoria; 0 la desactiva.
orders.cache.ttl=60s
# Antigüedad máxima de la copia que se sirve si el servicio externo falla.
orders.cache.max-stale=10m
